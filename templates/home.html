{% extends "base.html" %}
{% block title %}LunchSync{% endblock %}
{% block content %}
<h1>Start a lunch event</h1>
<form method="post" action="/events">
  <label>Location</label>
  <input name="location" value="Bangalore Office" required />

  <label>Budget per head (Rs.)</label>
  <input name="budget_per_head" type="number" value="200" required />

  <label>Approximate headcount</label>
  <input name="headcount_estimate" type="number" value="25" required />

  <label>Poll duration (minutes, demo default is short)</label>
  <input name="poll_minutes" type="number" value="2" required />

  <button type="submit">Create event & open dietary poll</button>
</form>

{% if events %}
<h2>Recent events</h2>
{% for e in events %}
<div class="card">
  <a href="/events/{{ e.id }}">Event #{{ e.id }} — {{ e.location }}</a>
  <span class="status">{{ e.status }}</span>
</div>
{% endfor %}
{% endif %}
{% endblock %}
